name: Build SFA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: sing-box

      - name: checkout app
        uses: actions/checkout@v6
        with:
          path: sing-box-for-android
          repository: SagerNet/sing-box-for-android
          ref: "main"

      - name: checkout app submodules
        run: |-
          cd sing-box-for-android
          git submodule update --init --recursive -v

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "~1.26"
          cache-dependency-path: "**/go.sum"

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # the default branch is testing; save the cache from dance-crate too
          cache-read-only: false

      - name: setup ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: build libbox
        env:
          # CGO_ENABLED: "0"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        # refer to make lib_android
        run: |
          mkdir -p sing-box-for-android/app/libs/
          cd sing-box
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -skip-legacy

      - name: update version
        run: |
          cd sing-box
          make update_android_version

      - name: setup keystore
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: echo "$SIGN_KEY" | base64 -d > sing-box-for-android/app/release.keystore

      - name: build app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          cd sing-box-for-android
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherRelease -x lintVitalOtherRelease

      - name: upload apk
        uses: actions/upload-artifact@v6
        env:
          APK_ARCH: arm64-v8a
        with:
          name: SFA-${{ env.APK_ARCH }}
          path: sing-box-for-android/app/build/outputs/apk/other/release/*-${{ env.APK_ARCH }}.apk
